<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Gatherwise logo: a pickaxe and a herb inside a gathering route, with the guide arrow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d332e"/>
      <stop offset="1" stop-color="#0b1613"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5af2d9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5af2d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3f5"/>
      <stop offset="1" stop-color="#8fa1aa"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a86b36"/>
      <stop offset="1" stop-color="#6e4220"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9be27a"/>
      <stop offset="1" stop-color="#3f9a4a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe07a"/>
      <stop offset="1" stop-color="#e0a020"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect x="0" y="0" width="400" height="400" rx="76" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="190" fill="url(#glow)"/>

  <!-- Faint map contour lines -->
  <g fill="none" stroke="#5af2d9" stroke-opacity="0.09" stroke-width="3">
    <path d="M-10 92 C 70 60, 130 120, 210 88 S 350 40, 420 80"/>
    <path d="M-10 322 C 80 290, 150 350, 240 318 S 360 280, 420 312"/>
    <path d="M-10 356 C 90 330, 170 380, 260 352 S 370 320, 420 346"/>
  </g>

  <!-- The route: a loop through the nodes -->
  <path id="loop" d="M 200 62 C 300 62, 342 128, 336 196 C 330 268, 276 334, 196 336 C 116 338, 62 282, 64 200 C 66 120, 112 62, 200 62 Z"
        fill="none" stroke="#5af2d9" stroke-width="11" stroke-linecap="round" stroke-dasharray="1 24" stroke-opacity="0.95"/>

  <!-- Nodes on the route: copper, herb, tin, herb -->
  <g stroke="#0b1613" stroke-width="5">
    <circle cx="324" cy="132" r="20" fill="#d98a4a"/>
    <circle cx="300" cy="300" r="20" fill="#7fd36b"/>
    <circle cx="96" cy="296" r="20" fill="#c9d1d6"/>
    <circle cx="72" cy="140" r="20" fill="#7fd36b"/>
  </g>

  <!-- Guide arrow at the top of the loop, heading clockwise -->
  <path d="M 172 36 L 238 62 L 172 88 L 186 62 Z" fill="url(#gold)" stroke="#5a3b00" stroke-width="4" stroke-linejoin="round"/>

  <!-- Herb leaf behind the pickaxe -->
  <g transform="rotate(38 200 205)">
    <path d="M 200 112 C 248 150, 252 236, 200 300 C 148 236, 152 150, 200 112 Z" fill="url(#leaf)" stroke="#173d1d" stroke-width="6"/>
    <path d="M 200 128 L 200 292" stroke="#173d1d" stroke-width="5" stroke-linecap="round"/>
    <path d="M 200 180 L 226 160 M 200 214 L 230 190 M 200 180 L 174 160 M 200 214 L 170 190" stroke="#173d1d" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Pickaxe -->
  <g transform="rotate(-38 200 205)">
    <rect x="189" y="138" width="22" height="168" rx="9" fill="url(#wood)" stroke="#2c1a0b" stroke-width="6"/>
    <path d="M 100 168 C 132 104, 268 104, 300 168 C 270 150, 236 150, 212 152 L 212 168 L 188 168 L 188 152 C 164 150, 130 150, 100 168 Z"
          fill="url(#steel)" stroke="#2a3338" stroke-width="6" stroke-linejoin="round"/>
    <rect x="184" y="140" width="32" height="30" rx="6" fill="#56656d" stroke="#2a3338" stroke-width="6"/>
  </g>
</svg>
